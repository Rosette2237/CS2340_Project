<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Career Connect</title>
</head>
<style>
    .vr.white {
        background-color: white;
        opacity: 0.75;
        width: 2px;
        height: 25px;
        align-self: center;
    }

    body{
        background-color: black;
        overflow: hidden;
        margin: 0;
    }            
    .content {
        position: absolute;
        text-align: center;
        color: white;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    h1 {
        font-size: 75px;
    }

    h3 {
        font-size: 30px;

    }
    p {
        font-size: 20px;
    }
    /* Navbar Styles */
    nav {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
            padding: 20px 50px;
            position: absolute;
            box-sizing: border-box;
        }

        .logo {
            color: whitesmoke;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 30px;

        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: opacity 0.2s;
        }

        .nav-links a:hover {
            opacity: 0.7;
        }

</style>
<body>
    <!-- Header -->
    <nav>
        <a href="/" class="logo">CareerConnect</a>
        <ul class="nav-links">
            <li><a href="{% url 'home.index' %}"">Jobs</a></li>
            <div class="vr white mx-2 d-none d-lg-block"></div>
            <li><a href="{% url 'home.index' %}"">Map</a></li>
            <div class="vr white mx-2 d-none d-lg-block"></div>
            <li><a href="{% url 'home.index' %}"">Profile</a></li>
        </ul>
    </nav>
    <!-- Header -->

    {% block content %}
    {% endblock content %}
    <!-- Footer -->
    <!-- Footer -->

</body>
</html>
