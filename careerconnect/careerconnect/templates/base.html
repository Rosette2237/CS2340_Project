<!DOCTYPE html>
    <html>
    {% load static %}
    <head>
        <title>CareerConnect</title>
        <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    </head>
    <body>
        <!-- Header -->
        <nav>
            <a class="logo" href="/">
                <img src="{% static 'img/CCLogo.png' %}" alt="CareerConnect" height="225" />
            </a>
            <ul class="nav-links">
                <li><a href="{% url 'jobs.index' %}"">Explore Jobs</a></li>
                <li><a href="{% url 'maps.index' %}"">View Map</a></li>
                <div class="vr white mx-2 d-none d-lg-block"></div>

                {% if user.is_authenticated %}
                <li><a href="{% url 'profile.edit' %}"">My Profile</a></li>
                <li><a href="{% url 'accounts.logout' %}"">Logout ({{ user.username }})</a></li>'

                {% else %}
                <li><a href="{% url 'accounts.login' %}"">Login</a></li>
                <li><a href="{% url 'accounts.signup' %}"">Sign Up</a></li>'
                {% endif %}

            </ul>
        </nav>
        <!-- Header -->

        {% block content %}
        {% endblock content %}
        <!-- Footer -->
        <!-- Footer -->

        <canvas id="starCanvas"></canvas>

        <script>
            const canvas = document.getElementById('starCanvas');
            const ctx = canvas.getContext('2d');

            let stars = [];
            const numStars = 400;

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            window.addEventListener('resize', resize);
            resize();

            class Star {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.baseRadius = Math.random() * 1.5;
                    this.color = `rgba(255, 255, 255, ${Math.random() * 0.7 + 0.3})`;
                    this.timer = Math.random();
                    this.pulseTimer = Math.random() * 0.05;
                    this.maxScale = 2;
                }

                update() {
                    this.timer += this.pulseTimer;
                    let pulse = Math.sin(this.timer);
                    let growth = pulse > 0 ? pulse * this.maxScale : 0;
                    this.currentRadius = this.baseRadius + growth;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.currentRadius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.closePath();
                }

            }

            function init() {
                stars = [];
                for (let i = 0; i < numStars; i++) {
                    stars.push(new Star());
                }
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                stars.forEach(star => {
                        star.update();
                        star.draw();
                    });
                requestAnimationFrame(animate);
            }

            init();
            animate();
        </script>
    </body>
    </html>
