{% extends 'base.html' %}
{% load static %}

{% block content %}
<canvas id="starCanvas"></canvas>

<div class="main-scroll-area">
    <div class="profile-card">
        <h1 class="page-title">Sign Up</h1> 
        
        <form method="POST">
            {% csrf_token %}
            
            {% for field in template_data.form %}
                <div class="mb-4">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    
                    {% if field.errors %}
                        {% for error in field.errors %}
                            <div class="alert alert-danger" style="color: #ff4d4d; font-size: 0.85rem; margin-top: 5px; font-weight: bold;">
                                {{ error }}
                            </div>
                        {% endfor %}
                    {% endif %}
                </div>
            {% endfor %}

            <div class="button-row" style="margin-top: 30px;">
                <button type="submit" class="btn-save" style="width: 100%;">Create Account</button>
            </div>
        </form>
        
        <p style="text-align: center; margin-top: 30px; color: #b0b0b0;">
            Already have an account? <a href="{% url 'accounts.login' %}" style="color: white; text-decoration: underline;">Login here</a>
        </p>
    </div>
</div>

<script>
    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Star {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.baseRadius = Math.random() * 1.5;
            this.timer = Math.random();
            this.pulseTimer = Math.random() * 0.05;
        }
        update() {
            this.timer += this.pulseTimer;
            this.currentRadius = this.baseRadius + (Math.sin(this.timer) > 0 ? Math.sin(this.timer) * 2 : 0);
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.currentRadius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fill();
        }
    }

    for (let i = 0; i < 400; i++) stars.push(new Star());
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => { s.update(); s.draw(); });
        requestAnimationFrame(animate);
    }
    animate();
</script>
{% endblock %}
