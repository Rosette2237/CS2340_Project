{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="main-scroll-area">
    <div class="profile-card">
        <h1 class="page-title">Login</h1>

        <form method="POST">
            {% csrf_token %}
            {% if template_data.error %}
                <div class="alert alert-danger" style="color: red; margin-bottom: 15px;">
                    {{ template_data.error }}
                </div>
            {% endif %}

            <label class="form-label">Username</label>
            <input type="text" name="username" class="custom-input" required>

            <label class="form-label">Password</label>
            <input type="password" name="password" class="custom-input" required>

            <div class="button-row">
                <button type="submit" class="btn-save">Login</button>
            </div>
        </form>

        <p style="text-align: center; margin-top: 20px; color: #b0b0b0;">
            Don't have an account? <a href="{% url 'accounts.signup' %}" style="color: white; text-decoration: underline;">Sign Up</a>
        </p>
    </div>
</div>
{% endblock %}
