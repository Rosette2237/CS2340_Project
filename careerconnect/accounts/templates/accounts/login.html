{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="main-scroll-area">
    <div class="profile-card">
        <h1 class="page-title">Login</h1> 
        
        <form method="POST">
            {% csrf_token %}
            {% if template_data.error %}
                <div class="alert alert-danger" style="color: red; margin-bottom: 15px;">
                    {{ template_data.error }}
                </div>
            {% endif %}

            <label class="form-label">Username</label>
            <input type="text" name="username" class="custom-input" required>

            <label class="form-label">Password</label>
            <input type="password" name="password" class="custom-input" required>

            <div class="button-row">
                <button type="submit" class="btn-save">Login</button>
            </div>
        </form>
        
        <p style="text-align: center; margin-top: 20px;">
            Don't have an account? <a href="{% url 'accounts.signup' %}">Sign Up</a>
        </p>
    </div>
</div>

<script>
    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Star {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.baseRadius = Math.random() * 1.5;
            this.timer = Math.random();
            this.pulseTimer = Math.random() * 0.05;
        }
        update() {
            this.timer += this.pulseTimer;
            this.currentRadius = this.baseRadius + (Math.sin(this.timer) > 0 ? Math.sin(this.timer) * 2 : 0);
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.currentRadius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fill();
        }
    }

    for (let i = 0; i < 400; i++) stars.push(new Star());
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => { s.update(); s.draw(); });
        requestAnimationFrame(animate);
    }
    animate();
</script>
{% endblock %}
