{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="main-scroll-area">
    <div class="profile-card">
        <h1 class="page-title">Edit Profile</h1>

        <form method="POST">
            {% csrf_token %}
            <label class="form-label">Address (Optional)</label>
            <input type="text" name="address" class="custom-input"
                   value="{{ profile.address }}" placeholder="e.g. 123 Main St.">

            <div style="display:flex; gap:20px;">
                <div style="flex:2; min-width:0;">
                    <label class="form-label">City</label>
                    <input type="text" name="city" class="custom-input"
                           value="{{ profile.city }}" placeholder="e.g. Atlanta">
                </div>
                <div style="flex:1; min-width:0;">
                    <label class="form-label">State</label>
                    <input type="text" name="state" class="custom-input"
                           value="{{ profile.state }}" placeholder="e.g. GA">
                </div>
            </div>

            <label class="form-label">Headline</label>
            <input type="text" name="headline" class="custom-input"
                   value="{{ profile.headline }}" placeholder="e.g. Software Engineer | Georgia Tech Student">

            <label class="form-label">Skills</label>
            <textarea name="skills" class="custom-input" rows="4"
                    placeholder="Python, Django, React, Algorithms...">{{ profile.skills }}</textarea>

            <label class="form-label">Education</label>
            <textarea name="Education" class="custom-input" rows="4"
                    placeholder="University Name, Major...">{{ profile.education }}</textarea>

            <label class="form-label">Work Experience</label>
            <textarea name="work_experience" class="custom-input" rows="5"
                    placeholder="Briefly describe internships, research projects, or leadership roles...">{{ profile.work_experience }}</textarea>

            <div class="row">
                <div class="col-md-6">
                    <label class="form-label">LinkedIn URL (Optional)</label>
                    <input type="url" name="linkedin_link" class="custom-input"
                    value="{{ profile.linkedin_link }}" placeholder="https://linkedin.com/in/your-username">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Portfolio URL (Optional)</label>
                    <input type="url" name="portfolio_link" class="custom-input"
                    value="{{ profile.portfolio_link }}" placeholder="https://yourdomain.com or https://github.com/your-username">
                </div>
            </div>

            <div class="checkbox-row" style="display: flex; align-items: center; gap: 10px; margin-bottom: 25px;">
                <label for="is_public" class="form-label" style="margin: 0;">Public Profile: </label>
                <input type="checkbox" name="is_public" id="is_public" style="width: 20px; height: 20px; cursor: pointer; flex-shrink: 0;"
                    {% if profile.is_public %}
                        checked
                    {% endif %}>
            </div>
            <p style="margin-top: -15px; margin-bottom: 25px; font-size: 14px; color: #666;">
                <em>*Note: Check = Visible. A public profile (visible) means that your profile is searchable and viewable by recruiters.</em>
            </p>
            <div class="button-row">
                <a href="/" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-save">Save Changes</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
